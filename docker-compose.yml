services:
  postgres:
    image: postgres:17.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      OPENWEBUI_DB_NAME: ${OPENWEBUI_DB_NAME:?Set OPENWEBUI_DB_NAME in .env}
      OPENWEBUI_DB_USER: ${OPENWEBUI_DB_USER:?Set OPENWEBUI_DB_USER in .env}
      OPENWEBUI_DB_PASSWORD: ${OPENWEBUI_DB_PASSWORD:?Set OPENWEBUI_DB_PASSWORD in .env}
      LITELLM_DB_NAME: ${LITELLM_DB_NAME:?Set LITELLM_DB_NAME in .env}
      LITELLM_DB_USER: ${LITELLM_DB_USER:?Set LITELLM_DB_USER in .env}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2.11.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      openwebui:
        condition: service_healthy

  openwebui:
    image: openwebui/open-webui:0.13.0-slim
    restart: unless-stopped
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      DATABASE_URL: postgresql://${OPENWEBUI_DB_USER:?Set OPENWEBUI_DB_USER in .env}:${OPENWEBUI_DB_PASSWORD:?Set OPENWEBUI_DB_PASSWORD in .env}@postgres:5432/${OPENWEBUI_DB_NAME:?Set OPENWEBUI_DB_NAME in .env}
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  openwebui_data:
  postgres_data:
