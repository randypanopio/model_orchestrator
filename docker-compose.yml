services:
  postgres:
    profiles:
      - local-db
    image: postgres:17.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      OPENWEBUI_DB_NAME: ${OPENWEBUI_DB_NAME:-}
      OPENWEBUI_DB_USER: ${OPENWEBUI_DB_USER:-}
      OPENWEBUI_DB_PASSWORD: ${OPENWEBUI_DB_PASSWORD:-}
      LITELLM_DB_NAME: ${LITELLM_DB_NAME:-}
      LITELLM_DB_USER: ${LITELLM_DB_USER:-}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2.11.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      openwebui:
        condition: service_healthy

  openwebui:
    image: openwebui/open-webui:0.13.0-slim
    restart: unless-stopped
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      DATABASE_URL: ${OPENWEBUI_DATABASE_URL:-postgresql://${OPENWEBUI_DB_USER:-openwebui}:${OPENWEBUI_DB_PASSWORD:-}@postgres:5432/${OPENWEBUI_DB_NAME:-openwebui}}
      OPENAI_API_BASE_URLS: http://router:8000/v1
      OPENAI_API_KEYS: ${ROUTER_API_KEY:?Set ROUTER_API_KEY in .env}
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      router:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:v1.108.0
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:-}@postgres:5432/${LITELLM_DB_NAME:-litellm}}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Set LITELLM_SALT_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=5)"
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s

  router:
    build:
      context: ./services/router
    restart: unless-stopped
    environment:
      ROUTER_API_KEY: ${ROUTER_API_KEY:?Set ROUTER_API_KEY in .env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      LITELLM_BASE_URL: http://litellm:4000/v1
      MODEL_CONFIG_PATH: /app/config/models.yaml
    volumes:
      - ./config/models.yaml:/app/config/models.yaml:ro
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
  openwebui_data:
  postgres_data:
